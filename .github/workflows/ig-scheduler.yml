name: ig-scheduler

# Scheduler Instagram (pengganti Vercel Cron, yang tidak tersedia di akun Hobby).
# Lihat docs/ARSITEKTUR-GRATIS.md bagian 3.
#
# Prasyarat (set sekali di GitHub):
#   Settings -> Secrets and variables -> Actions
#   - Secret  CRON_SECRET : nilai yang sama dengan env CRON_SECRET di Vercel
#   - Variable APP_URL    : https://jokitugasit.my.id

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: ig-scheduler
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger scheduler
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -eu
          if [ -z "${APP_URL:-}" ]; then
            echo "::error::Variable APP_URL belum diset di repo settings."
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Secret CRON_SECRET belum diset di repo settings."
            exit 1
          fi
          curl -fsS -X POST "${APP_URL}/api/ig-run-schedule" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 60 --retry 2 --retry-delay 5
